eureka:
  instance:
    prefer-ip-address: true
    ip-address: ${MY_NODE_IP:127.0.0.1}
    instance-id: ${eureka.instance.ip-address}:${spring.application.name}:${eureka.instance.non-secure-port}
    non-secure-port: ${REG_PORT:8080}
  client:
    serviceUrl:
      defaultZone: http://${eureka.user:dante}:${eureka.pwd:123456}@${eureka.host:localhost}:${eureka.port:8761}/eureka/
feign:
  hystrix:
    enabled: true
  