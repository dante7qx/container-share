apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: ccb-api2
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: ccb-api2
  template:
    metadata:
      labels:
        app: ccb-api2
    spec:
      containers:
      - name: ccb-api2
        image: ccb-api2:v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: ccb-api2
          containerPort: 8080
        resources:
          requests:
            cpu: 128m
            memory: 256Mi
          limits:
#            cpu: 500m
            memory: 512Mi
        envFrom:
        - configMapRef: 
            name: ccb-k8s-configmap
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ccb-api2
              topologyKey: kubernetes.io/hostname