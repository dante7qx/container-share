eureka:
  instance:
    prefer-ip-address: true
    ip-address: ${MY_NODE_IP:127.0.0.1}
    instance-id: ${eureka.instance.ip-address}:${spring.application.name}:${eureka.instance.non-secure-port}
    non-secure-port: ${REG_PORT:8080}
  client:
    serviceUrl:
      defaultZone: http://${eureka.user:dante}:${eureka.pwd:123456}@${eureka.host:localhost}:${eureka.port:8761}/eureka/
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
      - id: ccb-portal
        uri: lb://CCB-PORTAL
        predicates:
        - Path=/**
        order: 3
      - id: ccb-api1
        uri: lb://CCB-API1
        predicates:
        - Path=/b1/**
        filters:
        - StripPrefix=1 
        order: 1  
      - id: ccb-api2
        uri: lb://CCB-API2
        predicates:
        - Path=/b2/**
        filters:
        - StripPrefix=1 
        order: 2           